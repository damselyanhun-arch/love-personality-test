<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>测你的恋爱人格</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#392d39;background:#f7f3ed;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:920px;margin:auto;padding:clamp(18px,5vw,64px)}header{display:flex;align-items:center;gap:12px;border-bottom:1px solid #cbbfc0;padding-bottom:14px;font-weight:700}header span{color:#a13a4e;font-size:23px}article{margin:30px 0;background:#fffcf6;border:1px solid #d5c8c6;border-radius:16px;padding:clamp(20px,5vw,56px);box-shadow:0 8px 0 #e9e1db}h1,h2{font-family:Georgia,"Songti SC",SimSun,serif;line-height:1.35;margin:16px 0}h1{font-size:clamp(38px,6vw,68px);letter-spacing:-.045em}h2{font-size:clamp(24px,4vw,38px)}p{margin:14px 0}.muted,small{color:#72606a}.intro{display:grid;grid-template-columns:1fr 170px;align-items:center;gap:24px}.envelope{justify-self:center;position:relative;width:140px;height:96px;background:#eab5ad;border:1px solid #bd847f;transform:rotate(8deg);box-shadow:5px 6px 0 #f1dfd4;overflow:hidden}.envelope:before{content:"";position:absolute;width:100px;height:100px;top:-55px;left:18px;transform:rotate(45deg);background:#f3ccc4;border:1px solid #bd847f}.envelope:after{content:"♥";position:absolute;left:56px;top:27px;font-size:31px;color:#a53650}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:11px 22px;font-weight:650}.primary{background:#91334d;color:white}.primary:hover{background:#762540}.primary:disabled{background:#e6dddd;color:#766a70;cursor:default}.back{background:transparent;color:#714959}.actions,.meta{display:flex;justify-content:space-between;align-items:center;gap:12px}.actions{margin-top:24px}.meta{color:#805566;font-size:14px}.track{height:5px;background:#eee2df;border-radius:5px;margin:10px 0 30px;overflow:hidden}.track i{height:100%;background:#ae5369;display:block}.choices{display:grid;gap:10px;margin:23px 0}.choice{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid #d9cdca;border-radius:10px;cursor:pointer}.choice:hover{background:#f7eee8}.choice:has(input:checked){background:#f7e4e7;border-color:#a44962}.choice input{accent-color:#91334d;width:17px;height:17px;flex:none}.choice b{font:italic 18px Georgia;color:#8d4e60}button:focus-visible,.choice:focus-within{outline:3px solid #795580;outline-offset:3px}.result{border-top:1px solid #ddd0cc;padding-top:14px}.result strong{color:#8a3853}h3{margin:22px 0 6px;font-size:17px}.note{font-size:13px;margin-top:22px}.intro button{margin-top:12px}[hidden]{display:none!important}@media(max-width:600px){.intro{grid-template-columns:1fr}.envelope{grid-row:1;width:108px;height:76px;justify-self:start;margin:6px}.envelope:before{left:2px}.envelope:after{left:41px;top:22px}article{margin-top:18px}.actions button{padding:11px 14px}} 
</style></head><body><main><header><span aria-hidden="true">♡</span> 测你的恋爱人格</header><article id="card"></article></main>
<script>
"use strict";
// 交替观察两个维度：表达时机、关心方式。每题四种答案由同一轴的一端排到另一端，展示顺序另行轮换。
const questions=[
  [
    "心动期 · 日常习惯",
    "刚看完一部很喜欢的电影，出门时想起喜欢的人也爱看这一类。你会？",
    "马上发消息约对方二刷",
    "先发电影票根，问对方有没有兴趣",
    "下次聊电影时，顺势提起一起看",
    "先记在心里，等有单独见面的机会再说"
  ],
  [
    "心动期 · 日常习惯",
    "和喜欢的人散步，对方随口说「今天走得有点累」。你第一反应是？",
    "找最近能坐下的地方，提议过去歇会儿",
    "放慢脚步，问要不要把回去的路走短点",
    "问问今天是不是特别忙，听对方聊几句",
    "问一句「还想聊聊，还是咱们安静坐会儿？」"
  ],
  [
    "心动期 · 社交模式",
    "聚餐散场，你想和喜欢的人单独多待一会儿。你会？",
    "直接问「要不要和我再走一段？」",
    "问对方怎么回去，顺势提议同行",
    "走到路口，看看有没有自然独处的机会",
    "今晚先道别，下次有合适的话题再单独约"
  ],
  [
    "心动期 · 情绪反应",
    "你们正互有好感。对方说今天工作出了岔子，有点丧。你最想回哪句？",
    "「你还在忙吗？我给你带份晚饭。」",
    "「要不要一起走走？我过来接你。」",
    "「今天最糟心的是哪一段？」",
    "「你可以跟我抱怨，也可以安静待会儿，我都陪你。」"
  ],
  [
    "心动期 · 处事方式",
    "单独约会了几次，你想知道彼此是不是在认真发展。你更可能怎么开口？",
    "下次见面就告诉对方自己的心意，也问问对方",
    "聊到下次约会时，提一句自己期待更进一步",
    "先整理好自己想要的关系，再约个时间聊",
    "再相处几次，等自己更确定时谈"
  ],
  [
    "心动期 · 日常习惯",
    "晚饭后各自到家。对方发来「今天跟你待在一起挺开心的」，你也有同感。你最自然会怎么回？",
    "「我也是！下次那家店我来订，周末有空吗？」",
    "「我也是。你说想吃的那家，我记下了，下次一起去。」",
    "「我也是。刚才咱俩同时说出那句话，我现在想起来还想笑。」",
    "「我也是。跟你待着很自在，有些话很自然就说出来了。」"
  ],
  [
    "刚交往 · 社交模式",
    "刚确认关系，恋人想牵你的手，又像是有点犹豫。你也愿意，会怎么回应？",
    "笑着说「我也想牵」，直接伸手",
    "轻轻碰一下对方的手，让对方知道可以",
    "再并肩走一会儿，等自己放松了再牵",
    "等到两人独处、感觉自在时，再表达这份亲近"
  ],
  [
    "刚交往 · 兴趣偏好",
    "恋人想带你了解自己很着迷的一项爱好。第一次一起体验，你最期待哪个环节？",
    "亲手和对方完成一个小作品",
    "跟着对方学一个小技巧，以后还能一起玩",
    "听对方讲当初怎么喜欢上它",
    "看对方讲到兴奋处，聊聊它到底带来了什么感受"
  ],
  [
    "刚交往 · 情绪反应",
    "约会时，恋人几次低头回消息，你慢慢有点失落。你通常什么时候说？",
    "当下就说「我挺期待今天见面的，想和你专心聊会儿」",
    "等对方回完这一条，轻声提一下",
    "散场后理清感受，再发消息说",
    "先看看是不是一次特殊情况，有合适的时机再谈"
  ],
  [
    "刚交往 · 处事方式",
    "约会当天突然下大雨，恋人说期待了好久的露天活动泡汤了。你下意识会？",
    "马上查改期时间和附近能去的地方",
    "找个舒服的位置坐下，一起挑备用安排",
    "问问原计划里哪一部分最让对方舍不得",
    "先陪对方失落一会儿，听听这场约会为什么特别"
  ],
  [
    "刚交往 · 日常习惯",
    "你希望睡前偶尔能和恋人通个电话。你会怎么让对方知道？",
    "今晚就说「想听听你的声音，方便打电话吗？」",
    "下次聊得开心时问「要不要改成语音？」",
    "留意几天两个人的作息，再找时间提",
    "先想清楚自己期待的频率，周末见面时再谈"
  ],
  [
    "刚交往 · 社交模式",
    "恋人第一次跟你参加聚会，和大家还不熟。你最自然会做什么？",
    "提前接上对方，一起到场、一起找座位",
    "介绍一位兴趣相近的人，把话题接起来",
    "隔一会儿问问对方聊得怎么样",
    "留意对方的表情，找个安静角落听听感受"
  ],
  [
    "刚交往 · 兴趣偏好",
    "你很想和恋人去看一场小众演出，又拿不准对方喜不喜欢。你会？",
    "把海报发过去，直接说我想和你一起去",
    "分享一首现场曲目，顺势问有没有兴趣",
    "下次聊音乐时，再提自己想去",
    "自己先多听几首，想好为什么想一起去再邀请"
  ],
  [
    "刚交往 · 情绪反应",
    "恋人说「我今天特别想家」。如果你们今晚都空着，哪件事你最想做？",
    "买好食材，照着家乡菜谱一起做晚饭",
    "一起去找对方小时候常吃的点心",
    "请对方讲一件记得最清楚的家里的小事",
    "安静陪一会儿，听对方说今晚最想念谁"
  ],
  [
    "稳定期 · 处事方式",
    "两个人对假期怎么过有分歧，你发现自己其实很在意。你更可能？",
    "马上说出自己最想做的事，开始商量",
    "各讲一个最想保留的安排，再慢慢拼",
    "先把自己的优先顺序写下来，晚点再聊",
    "给自己一点时间分清哪些能让步，再完整地谈"
  ],
  [
    "稳定期 · 日常习惯",
    "恋人明天有一件很重要的事，睡前还有点紧张。你会先做什么？",
    "把第二天要带的东西一起检查一遍",
    "准备好早餐，让早上轻松一点",
    "问一句「明天哪一段最让你挂心？」",
    "抱一会儿，让对方把脑子里转个不停的话说完"
  ],
  [
    "稳定期 · 情绪反应",
    "一次争执后，你发现自己有句话说重了。你想修复关系，倾向何时开口？",
    "意识到就说「刚才那句话伤人，我收回」",
    "等两个人声音都平稳些，再当面道歉",
    "先想清那句话具体伤在哪里，晚一点聊",
    "给彼此一点时间，等自己能听完对方的感受再认真谈"
  ],
  [
    "稳定期 · 兴趣偏好",
    "如果要给两个人的周年纪念日留个纪念，你更想选哪件事？",
    "一起做一件每天都能用的小物",
    "把一年的照片洗出来装订好",
    "为几张照片写下只有你们懂的对白",
    "交换一封信，聊聊这一年何时最有被爱的感觉"
  ],
  [
    "稳定期 · 社交模式",
    "恋人要去外地两周。出发前，你意识到自己会很想念对方。你会怎么表达？",
    "想到就说「你还没走，我已经开始想你了」",
    "道别时说「到了给我发消息，我会想你」",
    "分别后找个安静的晚上，把想念写进消息",
    "等这种感受更清晰，再挑一次两人都放松的通话说"
  ],
  [
    "稳定期 · 处事方式",
    "恋人拿到外地的工作机会，还在犹豫，想和你一起聊聊。你最想从哪里谈起？",
    "一起算算通勤、开销和见面的可行安排",
    "列出各自在意的条件，看看哪些有办法兼顾",
    "问问对方想到接受这个机会时最期待什么",
    "彼此说说，想到可能异地时心里最舍不得什么"
  ]
];
const scores=[3,1,-1,-3];
const orders=[[0,2,1,3],[2,0,3,1],[3,1,0,2],[1,3,2,0]];
const profiles={
"++":["行动派搭档","喜欢一个人时，你容易把心意变成一个具体邀请。约好时间、记住小事、需要帮忙时出现，都是你表达亲近的方式。","替对方安排之前，先问一句「你想我搭把手，还是陪你待一会儿？」"],
"+-":["心声分享家","一件有趣的小事也能成为你联系对方的理由。你享受把话接下去的感觉，也希望认真说出口的心情能被回应。","遇到回复慢的人，可以把期待说具体：「你有空时，我挺想听听你怎么想。」"],
"-+":["慢热照顾者","你习惯先看一阵，再用合适的小事靠近对方。相处久了，别人可能才发现你记得多少细节。","偶尔替行动加一句注解：「刚刚看到这个想到你，特意留的。」"],
"--":["细腻倾听者","熟悉感对你很重要。一段能慢慢说完的话、一次舒服的沉默，都可能让你更愿意向对方敞开。","想被了解时，可以先分享自己的一点感受，也给对方接住你的机会。"],
"0+":["随性的实干搭档","你有时先开口，有时等一等，但想表达关心时，往往会做一件对方能直接感受到的小事。","可以问问对方，你做过的哪件小事最让人记得。"],
"0-":["自在的知心搭档","你的表达时机会随场合变化。聊起来之后，你尤其在意彼此有没有听懂话里的心情。","听完对方，也给自己的感受留一点说话时间。"],
"+0":["坦率的同行者","你愿意让对方知道自己的想法。至于关心，你既能陪人聊心事，也能卷起袖子一起解决麻烦。","开口前留个选择：「我们一起想办法，还是先聊会儿？」"],
"-0":["沉静的同行者","你喜欢把感觉理清楚再表达。熟悉起来后，有时你会认真听，有时你会默默把事情做好。","如果还需要想一想，可以先说「我在意这件事，晚点想和你聊」。"],
"00":["自在的多面搭档","你的两组选择都打成了平手。不同的场合里，你既会主动也会观察，既能提供实际帮助也在意情绪。","回想最舒服的一次相处，你当时更愿意主动做什么？这个细节可能比类型名更贴近你。"]
};
const card=document.querySelector("#card");
let index=0, answers=[];
function cover(){
card.innerHTML='<div class="intro"><div><small>20 道单选题 · 约 3 分钟</small><h1>测你的<br>恋爱人格</h1><p>从喜欢上一个人，到一起过普通日子。想象自己在题目里的那段关系，选最像你会做的事。</p><button class="primary" id="start">开始测试 →</button></div><div class="envelope" aria-hidden="true"></div></div>';
document.querySelector("#start").onclick=()=>{answers=[];index=0;question()};
}
function focusTitle(){card.querySelector("h2").focus();window.scrollTo(0,0)}
function question(){
const [category,title,...choices]=questions[index];
card.innerHTML='<div class="meta"><span>'+category+'</span><span>第 '+(index+1)+' / 20 题</span></div><div class="track"><i style="width:'+((index+1)*5)+'%"></i></div><h2 id="title" tabindex="-1">'+title+'</h2><div class="choices" role="radiogroup" aria-labelledby="title"></div><div class="actions"><button class="back" id="back">← '+(index?'上一题':'封面')+'</button><button class="primary" id="next">'+(index===19?'看我的结果':'下一题 →')+'</button></div>';
const group=card.querySelector(".choices"),next=card.querySelector("#next");
orders[index%4].forEach((value,j)=>{
const label=document.createElement("label");label.className="choice";
label.innerHTML='<input type="radio" name="answer"><b>'+String.fromCharCode(65+j)+'</b><span>'+choices[value]+'</span>';
const input=label.querySelector("input");input.checked=answers[index]===value;
input.onchange=()=>{answers[index]=value;next.disabled=false};group.append(label);
});
next.disabled=answers[index]===undefined;
next.onclick=()=>{if(index===19){result()}else{index++;question()}};
card.querySelector("#back").onclick=()=>{if(index){index--;question()}else{cover();card.querySelector("button").focus()}};
focusTitle();
}

const paceNotes={
"+":"你比较愿意在心意还热乎的时候说出来。你的坦率能减少猜测，但如果对方需要想一想，停顿很容易被理解成冷场。你可以把问题留给对方：「我想让你知道这件事，你慢慢想。」",
"-":"你比较常在心里把话理顺，再选时机开口。这能让谈话更有分寸，但对方也可能把等待理解成你已经不在意了。一句「这件事我还想跟你聊，今晚可以吗」，就能让这段安静更好懂。",
"0":"你在不同情境里选择了不同的开口时机。平时聊得痛快，遇到在意的事却想缓缓，完全可以同时发生。让对方知道你此刻属于哪一种，会比让人猜更轻松。"
};
const careNotes={
"+":"你常常通过一件能马上做到的小事表达关心。对方可能记得你把事情处理好了，却没听见那句藏在行动里的「我惦记你」。下次可以顺口把它也说出来。",
"-":"你常给对方留出讲感受的位置，尤其容易留意一句话背后的心情。有时对方已经说累了，只想有人替自己做个决定。这时问一句「晚饭我来安排，好吗？」也很贴心。",
"0":"你两种关心方式用得差不多。面对同一声叹气，你既可能接过一件事，也可能坐下来听一听。让恋人选「要我帮忙还是陪你聊聊」，就不用猜今天哪种更合适。"
};
function answerNote(i){
 const q=questions[i];
 return '<p><strong>第 '+(i+1)+' 题 · '+q[0].split(' · ')[0]+'</strong><br>'+q[1]+'<br>你选了「'+q[2+answers[i]]+'」</p>';
}
function extended(key){
 const conflict=['你倾向在察觉伤人的那一刻修复。先说明你后悔的是哪句话，再让对方讲完感受。','你愿意等语气平稳再开口。可以先约好过一会儿接着聊，让短暂停顿有个着落。','你会花时间想清楚哪句话伤到了对方。把这个具体细节说出来，道歉会更容易被听见。','你在意重新开口时，自己能不能耐心听完。先给对方一个重启对话的时间，两个人都少一点猜测。'];
 return '<h3>心动时，你发出的信号</h3><p>'+paceNotes[key[0]]+'</p><h3>恋人可能怎样读懂你的关心</h3><p>'+careNotes[key[1]]+'</p><h3>发生分歧后，你怎样重新靠近</h3><p>'+conflict[answers[16]]+'</p><details><summary>看解读对应的选择</summary>'+[1,5,16].map(answerNote).join('')+'</details>';
}

function result(){
const sums=[0,0];answers.forEach((value,i)=>{sums[i%2]+=scores[value]});
const key=sums.map(v=>v>0?"+":v<0?"-":"0").join("");
const [name,description,tip]=profiles[key];
function tendency(v,a,b){return v===0?"两端持平":(Math.abs(v)<=6?"略偏":"偏向")+(v>0?a:b)}
card.innerHTML='<small>你的恋爱人格</small><h2 tabindex="-1">'+name+'</h2><p>'+description+'</p><div class="result"><h3>你的两条相处倾向</h3><p><strong>表达时机</strong> · '+tendency(sums[0],"及时表达","想好再说")+'<br><strong>关心方式</strong> · '+tendency(sums[1],"实际行动","感受交流")+'</p>'+extended(key)+'<h3>给你的一句相处建议</h3><p>'+tip+'</p></div><p class="note muted">每个维度综合 10 道题。结果仅供趣味自我探索。</p><div class="actions"><button class="back" id="review">回看答案</button><button class="primary" id="restart">重新测试</button></div>';
card.querySelector("#review").onclick=()=>{index=0;question()};card.querySelector("#restart").onclick=()=>{cover();card.querySelector("button").focus()};focusTitle();
}
cover();
</script></body></html>
